<!doctype html><html><head><meta charset="utf-8"><title>Viper Android safe areas</title><style>body{margin:0;background:#e2e8f0;font:14px system-ui}iframe{border:1px solid #94a3b8;display:block;margin:12px;width:390px;height:640px}p,output{margin:12px;display:block}</style></head><body><p>Android UI simulation: 390 x 640, status 32px, navigation 48px</p><iframe title="Android app viewport" src="/"></iframe><output id="metrics"></output><script>const f=document.querySelector('iframe');f.onload=()=>{const d=f.contentDocument;d.documentElement.style.setProperty('--test-safe-top','32px');d.documentElement.style.setProperty('--test-safe-bottom','48px');for(const [edge,h,txt] of [['top',32,'21:45   •                         ▰ 100%'],['bottom',48,'◀       ●       ■']]){const b=d.createElement('div');b.textContent=txt;b.style.cssText=`position:fixed;${edge}:0;left:0;right:0;height:${h}px;background:#fff;display:grid;place-items:center;z-index:3000;color:#111;font:12px system-ui`;d.body.append(b)}setInterval(()=>{const modal=d.querySelector('.modal-card');const b=modal?.querySelector('.modal-footer button:last-child');const r=b?.getBoundingClientRect();document.querySelector('output').textContent=JSON.stringify({viewport:f.contentWindow.innerWidth,documentWidth:d.documentElement.scrollWidth,menuTop:d.querySelector('.mobile-menu').getBoundingClientRect().top,dialogSaveBottom:r?.bottom,bottomSafeEdge:592})},250)};</script></body></html>
